name: Comunicador de la Legión

on:
  workflow_dispatch:
    inputs: 
      villano:
        description: "Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac

      mensaje:
        description: 'Mensaje para el consejo'
        required: true
        default: 'La misión fue un éxito'
      prioridad:
        description: 'Nivel de importancia?'
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Medio
          - 🔴 Alta

jobs:
  # This workflow contains a single job called "build"
  transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Imprimir inputs
        run: |
          echo "Inputs: "
          echo ""
          echo "Villano: ${{ inputs.villano}}"
          echo "Nivel: ${{ inputs.prioridad}}"
          echo "Mensaje: ${{ inputs.mensaje}}"