name: Comunicador de la Legión

on:
  workflow_dispatch:
    inputs: 
      villano:
        description: "Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac

      mensaje:
        description: 'Mensaje para el consejo'
        required: true
        default: 'La misión fue un éxito'

      cow_character:
        description: 'Cow character'
        required: true
        type: choice
        options:
          - eyes
          - ghostbusters
          - dragon
          - fox
          - king
      
      prioridad:
        description: 'Nivel de importancia?'
        required: true
        type: choice
        options:
          - 🟢 Normal
          - 🟡 Medio
          - 🔴 Alta

jobs:
  # This workflow contains a single job called "build"
  transmitir-mensaje:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Instalar el tranmisor de la Legión
        run: sudo apt-get install -y cowsay


      - name: Imprimir inputs
        run: |
          echo "===================================================== "
          echo "            Transmisión interceptada"
          echo "===================================================== "
          echo ""
          echo "De: ${{ inputs.villano}}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
          echo "--------Mensaje--------"
          cowsay -f "${{inputs.cow_character}}" "${{inputs.mensaje}}"
          echo ""
          echo "---- ${{inputs.villano}}"
          echo "..."